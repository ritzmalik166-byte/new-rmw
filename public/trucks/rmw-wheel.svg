<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="rubber" cx="50%" cy="50%" r="50%">
      <stop offset="0.64" stop-color="#2c2c2f"/>
      <stop offset="0.8" stop-color="#1f1f22"/>
      <stop offset="0.93" stop-color="#161618"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8e8a83"/>
      <stop offset="0.5" stop-color="#bcb8b0"/>
      <stop offset="0.8" stop-color="#99958e"/>
      <stop offset="0.9" stop-color="#d9d5cd"/>
      <stop offset="1" stop-color="#5f5c57"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5b5853"/>
      <stop offset="0.85" stop-color="#3b3936"/>
      <stop offset="1" stop-color="#26241f"/>
    </radialGradient>
    <radialGradient id="cap" cx="40%" cy="36%" r="65%">
      <stop offset="0" stop-color="#d0644a"/>
      <stop offset="0.6" stop-color="#9a3320"/>
      <stop offset="1" stop-color="#5e1c11"/>
    </radialGradient>
    <rect id="lug" x="67.6" y="0.6" width="4.8" height="5.6" rx="1" fill="#070708"/>
    <rect id="rib" x="68.8" y="9.5" width="2.4" height="7" rx="1.2" fill="#323236"/>
    <ellipse id="hole" cx="70" cy="37" rx="5.4" ry="4.4" fill="#1c1b1a" stroke="#6f6b65" stroke-width="0.8"/>
    <circle id="nut" cx="70" cy="55.5" r="2.5" fill="#d3cec6" stroke="#4a4743" stroke-width="0.6"/>
  </defs>

  <!-- Tyre -->
  <circle cx="70" cy="70" r="69.5" fill="url(#rubber)"/>
  <g>
    <use xlink:href="#lug"/>
    <use xlink:href="#lug" transform="rotate(12 70 70)"/>
    <use xlink:href="#lug" transform="rotate(24 70 70)"/>
    <use xlink:href="#lug" transform="rotate(36 70 70)"/>
    <use xlink:href="#lug" transform="rotate(48 70 70)"/>
    <use xlink:href="#lug" transform="rotate(60 70 70)"/>
    <use xlink:href="#lug" transform="rotate(72 70 70)"/>
    <use xlink:href="#lug" transform="rotate(84 70 70)"/>
    <use xlink:href="#lug" transform="rotate(96 70 70)"/>
    <use xlink:href="#lug" transform="rotate(108 70 70)"/>
    <use xlink:href="#lug" transform="rotate(120 70 70)"/>
    <use xlink:href="#lug" transform="rotate(132 70 70)"/>
    <use xlink:href="#lug" transform="rotate(144 70 70)"/>
    <use xlink:href="#lug" transform="rotate(156 70 70)"/>
    <use xlink:href="#lug" transform="rotate(168 70 70)"/>
    <use xlink:href="#lug" transform="rotate(180 70 70)"/>
    <use xlink:href="#lug" transform="rotate(192 70 70)"/>
    <use xlink:href="#lug" transform="rotate(204 70 70)"/>
    <use xlink:href="#lug" transform="rotate(216 70 70)"/>
    <use xlink:href="#lug" transform="rotate(228 70 70)"/>
    <use xlink:href="#lug" transform="rotate(240 70 70)"/>
    <use xlink:href="#lug" transform="rotate(252 70 70)"/>
    <use xlink:href="#lug" transform="rotate(264 70 70)"/>
    <use xlink:href="#lug" transform="rotate(276 70 70)"/>
    <use xlink:href="#lug" transform="rotate(288 70 70)"/>
    <use xlink:href="#lug" transform="rotate(300 70 70)"/>
    <use xlink:href="#lug" transform="rotate(312 70 70)"/>
    <use xlink:href="#lug" transform="rotate(324 70 70)"/>
    <use xlink:href="#lug" transform="rotate(336 70 70)"/>
    <use xlink:href="#lug" transform="rotate(348 70 70)"/>
  </g>
  <circle cx="70" cy="70" r="63" fill="none" stroke="#0a0a0b" stroke-width="1" opacity="0.7"/>
  <!-- Sidewall moulding, so the turn reads even at speed -->
  <g>
    <use xlink:href="#rib"/>
    <use xlink:href="#rib" transform="rotate(30 70 70)"/>
    <use xlink:href="#rib" transform="rotate(60 70 70)"/>
    <use xlink:href="#rib" transform="rotate(90 70 70)"/>
    <use xlink:href="#rib" transform="rotate(120 70 70)"/>
    <use xlink:href="#rib" transform="rotate(150 70 70)"/>
    <use xlink:href="#rib" transform="rotate(180 70 70)"/>
    <use xlink:href="#rib" transform="rotate(210 70 70)"/>
    <use xlink:href="#rib" transform="rotate(240 70 70)"/>
    <use xlink:href="#rib" transform="rotate(270 70 70)"/>
    <use xlink:href="#rib" transform="rotate(300 70 70)"/>
    <use xlink:href="#rib" transform="rotate(330 70 70)"/>
  </g>
  <circle cx="70" cy="70" r="51" fill="none" stroke="#0b0b0c" stroke-width="2"/>

  <!-- Steel rim -->
  <circle cx="70" cy="70" r="49.5" fill="url(#rim)"/>
  <circle cx="70" cy="70" r="49.5" fill="none" stroke="#3e3b37" stroke-width="1.4"/>
  <circle cx="70" cy="70" r="44" fill="none" stroke="#77736c" stroke-width="1"/>
  <g>
    <use xlink:href="#hole"/>
    <use xlink:href="#hole" transform="rotate(45 70 70)"/>
    <use xlink:href="#hole" transform="rotate(90 70 70)"/>
    <use xlink:href="#hole" transform="rotate(135 70 70)"/>
    <use xlink:href="#hole" transform="rotate(180 70 70)"/>
    <use xlink:href="#hole" transform="rotate(225 70 70)"/>
    <use xlink:href="#hole" transform="rotate(270 70 70)"/>
    <use xlink:href="#hole" transform="rotate(315 70 70)"/>
  </g>

  <!-- Hub, wheel nuts and cap -->
  <circle cx="70" cy="70" r="21.5" fill="url(#hub)" stroke="#24221f" stroke-width="1"/>
  <g>
    <use xlink:href="#nut"/>
    <use xlink:href="#nut" transform="rotate(45 70 70)"/>
    <use xlink:href="#nut" transform="rotate(90 70 70)"/>
    <use xlink:href="#nut" transform="rotate(135 70 70)"/>
    <use xlink:href="#nut" transform="rotate(180 70 70)"/>
    <use xlink:href="#nut" transform="rotate(225 70 70)"/>
    <use xlink:href="#nut" transform="rotate(270 70 70)"/>
    <use xlink:href="#nut" transform="rotate(315 70 70)"/>
  </g>
  <circle cx="70" cy="70" r="9" fill="url(#cap)" stroke="#3a120b" stroke-width="0.8"/>
  <circle cx="70" cy="70" r="2.6" fill="#3a120b" opacity="0.6"/>
</svg>
